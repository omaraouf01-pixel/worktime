[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "worktime"
version = "0.1.0"
description = "Desktop application for tracking worker hours and settling pay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "ruff",
    "mypy",
    "types-openpyxl",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
